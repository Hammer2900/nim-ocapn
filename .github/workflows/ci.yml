name: nim-ocapn

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim: ["2.0.0", "2.2.0", "2.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
      - run: nimble test
      - name: Compile public examples
        run: |
          set -e
          for source in examples/api_server.nim examples/api_client.nim \
              examples/api_handoff.nim examples/native_multi_server.nim \
              examples/native_greeter_server.nim examples/native_glowcap_client.nim; do
            name=$(basename "$source" .nim)
            nim c --hints:off --verbosity:0 --out:"/tmp/nim-ocapn-$name" "$source"
          done
